<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Beaners</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css?v=v69">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splashLogo">BEANERS</div>
    <div class="splashSub">Loading the table...</div>
    <div id="splashVersion" class="splashVersion">v69</div>
  </div>

  <main>
    <section id="startScreen" class="panel">
      <div class="logo">BEANERS</div>
      <p class="hint">Enter your name first, then create a room or join your mates.</p>
      <label>Your player name</label>
      <input id="nameInput" maxlength="20" placeholder="Jamie">
      <label>Join code</label>
      <input id="roomInput" maxlength="4" inputmode="numeric" placeholder="Only needed if joining">
      <div class="startActions">
        <button id="createBtn">Create Room</button>
        <button id="joinBtn">Join Room</button>
      </div>
      <div id="startVersion" class="startDebug">v69</div>
    </section>

    <section id="game" class="hidden">
      <header class="topbar">
        <button id="exitBtn" class="iconBtn">×</button>
        <div class="roomBadge">Room <span id="roomCode">----</span></div>
        <button id="refreshBtn" class="refreshBtn">↻</button>
        <button id="restartGameBtn" class="restartGameBtn" title="Restart game">⟲</button>
        <div id="beanerBadge" class="beanerBadge">A</div>
      </header>

      <section id="lobby" class="lobby hidden">
        <div class="lobbyCard">
          <div class="inLobby">
            <strong>In Lobby:</strong>
            <div id="lobbyPlayers">Waiting...</div>
          </div>

          <div class="seatMap">
            <button class="seat seatTop" data-seat="top"><span class="seatName">Sit Here</span><span class="seatAction"></span></button>
            <button class="seat seatLeft" data-seat="left"><span class="seatName">Sit Here</span><span class="seatAction"></span></button>
            <div class="tableCircle">
              
              
              
              
            </div>
            <button class="seat seatRight" data-seat="right"><span class="seatName">Sit Here</span><span class="seatAction"></span></button>
            <button class="seat seatBottom" data-seat="bottom"><span class="seatName">Sit Here</span><span class="seatAction"></span></button>
          </div>
        </div>

        <div class="wheelRow">
          <div class="wheelShell"><div class="wheelPointer">▼</div><canvas id="starterWheel" width="280" height="280"></canvas></div>
          <div class="wheelControls">
            <button id="spinBtn">Spin Wheel</button>
            <div id="wheelResult"></div>
          </div>
        </div>

        <button id="startBtn" class="startGameBtn">Leeeeets Beaners - Scraps On!</button>
      </section>

      <section id="table" class="table hidden">
        <div id="playfield" class="playfield">
          <section class="playerZone zoneTop" data-zone="top">
            <div class="zoneHeader">
              <strong id="topName">Top</strong>
              <small id="topMeta">0 cards • 0 pts</small>
            </div>
            <div id="topMelds" class="zoneMelds"></div>
          </section>

          <section class="playerZone zoneLeft" data-zone="left">
            <div class="zoneHeader">
              <strong id="leftName">Left</strong>
              <small id="leftMeta">0 cards • 0 pts</small>
            </div>
            <div id="leftMelds" class="zoneMelds"></div>
          </section>

          <section class="centreStack">
            <button id="drawDeck" class="deck restoredDeck">
              <span>Deck</span>
              <strong id="deckCount">0</strong>
            </button>

            <div class="restoredDiscard">
              <button id="topDiscard" class="discardTop restoredDiscardTop">Discard</button>
              <div id="discardPreview" class="discardPreview restoredDiscardPreview"></div>
              <button id="takePile" class="smallBtn takePileBtn">Take Pile</button>
            </div>
          </section>

          <section class="playerZone zoneRight" data-zone="right">
            <div class="zoneHeader">
              <strong id="rightName">Right</strong>
              <small id="rightMeta">0 cards • 0 pts</small>
            </div>
            <div id="rightMelds" class="zoneMelds"></div>
          </section>

          <section class="playerZone zoneBottom" data-zone="bottom">
            <div class="zoneHeader">
              <strong id="bottomName">You</strong>
              <small id="bottomMeta">0 cards • 0 pts</small>
            </div>
            <div id="bottomMelds" class="zoneMelds"></div>
          </section>
        </div>

        <div class="handPanel restoredHandPanel">
          <div id="hand" class="hand"></div>
          <div class="actions">
            <button id="sortRank">Sort Rank</button>
            <button id="sortSuit">Sort Suit</button>
            <button id="layMeld">Lay Selected Meld</button>
            <button id="discardBtn">Discard</button>
          </div>
        </div>
      </section>

      <section id="scoreOverlay" class="scoreOverlay hidden">
        <div class="scoreCard">
          <h2 id="scoreTitle">BEANERS!</h2>
          <div id="scoreRows"></div>
          <button id="nextRoundBtn">Next Round</button>
        </div>
      </section>
    </section>
  </main>

  <script src="/version.js?v=v69"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js?v=v69"></script>
</body>
</html>
